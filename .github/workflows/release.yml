name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --release --locked

  ubuntu:
    needs: test
    # Runner mais antigo suportado, para o binário rodar no Ubuntu 22.04 e mais novos.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-deb --locked
      - run: cargo deb
      - name: Collect
        run: |
          mkdir dist
          cp target/debian/*.deb dist/
          mkdir undercovernc && cp target/release/undercovernc README.md LICENSE install.sh undercovernc/ && cp -r packaging undercovernc/
          mkdir -p undercovernc/assets && cp assets/VT323-OFL.txt undercovernc/assets/
          tar -czf "dist/undercovernc-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" undercovernc
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*

  arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git libxkbcommon wayland libglvnd xdg-desktop-portal cups hicolor-icon-theme
      - uses: actions/checkout@v5
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder .
          cd packaging && sudo -u builder makepkg -f --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/*.pkg.tar.zst

  release:
    needs: [ubuntu, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
